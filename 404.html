<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'">
<meta name="robots" content="noindex">
<title>صفحه پیدا نشد · حبه</title>
<style>
:root { color-scheme: light dark; --bg: #e3f3dc; --ink: #2f3a2c; --mint: #2fa877; }
@media (prefers-color-scheme: dark) { :root { --bg: #18221b; --ink: #e9f2e6; --mint: #5fd6a3; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: Vazirmatn, Tahoma, sans-serif; text-align: center; padding: 16px; }
img { width: 120px; height: 120px; }
h1 { font-size: 1.6rem; margin: 12px 0 4px; }
p { margin: 0 0 20px; opacity: .8; }
a { display: inline-block; padding: 12px 24px; border-radius: 14px; background: var(--mint); color: #fff; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
<img src="/img/icon.svg" alt="">
<h1>این صفحه پیدا نشد</h1>
<p>شاید لینک اشتباه باشه یا جابه‌جا شده باشه.</p>
<a href="/">برگشت به حبه</a>
</main>
</body>
</html>
